# Privacy: never log query strings (SSE auth tokens travel as ?token=).
# $uri is the normalised path without args.
log_format lbmain '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time';
