# Shared response headers for LocalBench (include in server + locations, because
# nginx drops inherited add_header as soon as a location defines its own).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# same-origin only: chart.js, fonts and app.js are self-hosted; blocks the
# Cloudflare-injected analytics beacon as well.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
# the UI is small and changes often: never let the edge serve stale JS/CSS.
add_header Cache-Control "no-cache" always;
