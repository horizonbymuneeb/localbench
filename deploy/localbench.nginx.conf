# bench.example.com — LocalBench (FastAPI/uvicorn on 127.0.0.1:21700)
# Public instance, no sign-in gate. Cloudflare terminates the edge.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

server {
    listen 80;
    listen [::]:80;
    server_name bench.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bench.example.com;

    real_ip_header CF-Connecting-IP;
    access_log /var/log/nginx/localbench.access.log lbmain;

    ssl_certificate     /etc/letsencrypt/live/bench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bench.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/localbench-headers.conf;

    client_max_body_size 2m;

    # Long-running benchmark runs stream progress over SSE; never buffer or
    # time them out at the origin (Cloudflare's own idle cap is covered by the
    # app's 10 s ": ping" comments).
    # CF URL normalisation can append a slash; canonicalise without changing
    # the method (308) so POST /api/runs/ still works.
    location = /api/runs/ {
        return 308 https://$host/api/runs$is_args$args;
    }

    location ^~ /api/runs {
        include /etc/nginx/snippets/localbench-headers.conf;
        proxy_pass http://127.0.0.1:21700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        include /etc/nginx/snippets/localbench-headers.conf;
        proxy_hide_header Cache-Control;
        proxy_pass http://127.0.0.1:21700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
